# EXAMPLE ONLY. Not included in Kustomize. Use scripts/create-k8s-secrets.ps1.
# Real values must not be committed. Base64 encoding is not encryption.
apiVersion: v1
kind: Secret
metadata: {name: backend-secret, namespace: gcs}
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://gcs:CHANGE_ME@postgres:5432/gcs
  JWT_SECRET: CHANGE_ME_TO_RANDOM_64_HEX_CHARACTERS
---
apiVersion: v1
kind: Secret
metadata: {name: postgres-secret, namespace: gcs}
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME
  GCS_DB_PASSWORD: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata: {name: bootstrap-secret, namespace: gcs}
type: Opaque
stringData:
  BOOTSTRAP_ADMIN_PASSWORD: CHANGE_ME
