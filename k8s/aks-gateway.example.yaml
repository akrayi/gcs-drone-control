# Optional platform-managed AKS application-routing alternative to Traefik.
# Enable managed Gateway API and app-routing Istio before applying.
# Create gcs-tls in gcs-ingress first. Substitute your real hostname.
apiVersion: v1
kind: Namespace
metadata:
  name: gcs-ingress
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gcs-gateway
  namespace: gcs-ingress
spec:
  gatewayClassName: approuting-istio
  listeners:
    - name: https
      hostname: gcs.example.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gcs-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: gcs
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gcs
  namespace: gcs
spec:
  parentRefs:
    - name: gcs-gateway
      namespace: gcs-ingress
      sectionName: https
  hostnames: [gcs.example.com]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: frontend
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-from-aks-gateway
  namespace: gcs
spec:
  podSelector:
    matchLabels: {app: frontend}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: gcs-ingress}
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: gcs-gateway
      ports: [{protocol: TCP, port: 8080}]
