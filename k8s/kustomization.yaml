apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gcs
resources:
  - namespace.yaml
  - identity.yaml
  - postgres.yaml
  - workloads.yaml
  - network-policies.yaml
  - bootstrap.yaml
  - ../policy
  - ../database
configMapGenerator:
  - name: gcs-config
    literals:
      - OPA_URL=http://opa:8181
      - ALLOWED_ORIGINS=https://gcs.example.com
images:
  - name: gcs-backend
    newName: YOUR_ACR.azurecr.io/gcs-backend
    newTag: v1
  - name: gcs-frontend
    newName: YOUR_ACR.azurecr.io/gcs-frontend
    newTag: v1
