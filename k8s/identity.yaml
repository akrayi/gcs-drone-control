apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opa
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
automountServiceAccountToken: false
---
# This is a human observer role, not a workload permission grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gcs-observer
rules:
  - apiGroups: [""]
    resources: [pods, services, events, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gcs-observers
subjects:
  - kind: Group
    name: REPLACE_WITH_ENTRA_OBSERVER_GROUP_OBJECT_ID
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: gcs-observer
  apiGroup: rbac.authorization.k8s.io
