name: gcs-zero-trust
services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1 first}
      GCS_DB_PASSWORD: ${GCS_DB_PASSWORD:?Run scripts/setup.ps1 first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init-app.sh:/docker-entrypoint-initdb.d/01-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [data]
  opa:
    build: ./policy
    networks: [policy]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  init:
    build: ./backend
    command: ["sh", "-c", "python -m app.manage init && python -m app.manage bootstrap-admin"]
    environment:
      DATABASE_URL: postgresql+psycopg://gcs:${GCS_DB_PASSWORD}@postgres:5432/gcs
      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup.ps1 first}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Run scripts/setup.ps1 first}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [data]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://gcs:${GCS_DB_PASSWORD}@postgres:5432/gcs
      JWT_SECRET: ${JWT_SECRET}
      OPA_URL: http://opa:8181
      ALLOWED_ORIGINS: http://localhost:8080
    depends_on:
      init: {condition: service_completed_successfully}
      opa: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [edge, data, policy]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      backend: {condition: service_healthy}
    networks: [edge]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  postgres-test:
    image: postgres:17.5-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: ephemeral-test-only
      POSTGRES_DB: gcs_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d gcs_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [test]
  tests:
    build: ./backend
    profiles: [test]
    command: ["pytest", "-q", "tests"]
    environment:
      DATABASE_URL: postgresql+psycopg://test:ephemeral-test-only@postgres-test:5432/gcs_test
      JWT_SECRET: test-only-signing-secret-at-least-32-characters
      OPA_URL: http://opa:8181
      RUN_INTEGRATION: "1"
      ALLOWED_ORIGINS: http://localhost:8080
    depends_on:
      postgres-test: {condition: service_healthy}
      opa: {condition: service_started}
    networks: [test, policy]
  policy-tests:
    image: openpolicyagent/opa:1.4.2-static
    profiles: [test]
    command: ["test", "/policy", "-v"]
    volumes: ["./policy:/policy:ro"]
networks:
  edge: {}
  data: {internal: true}
  policy: {internal: true}
  test: {internal: true}
volumes:
  postgres-data: {}
