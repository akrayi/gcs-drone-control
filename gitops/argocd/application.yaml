apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gcs
  namespace: argocd
spec:
  project: gcs
  source:
    repoURL: https://github.com/akrayi/gcs-drone-control.git
    targetRevision: deploy
    path: gitops/aks
  destination:
    server: https://kubernetes.default.svc
    namespace: gcs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
